<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COSMOGENESI — Dal Big Bang alla Coscienza</title>
<style>
  :root{
    --bg:#04060f;
    --panel:rgba(14,19,38,.86);
    --panel-solid:#0e1326;
    --border:#20294d;
    --text:#dfe6ff;
    --dim:#8590bb;
    --hot:#ffd9a0;
    --accent:#7fd8ff;
    --accent2:#b48cff;
    --life:#6ee7a8;
    --danger:#ff6b8a;
    --gold:#ffc95c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    font-size:13.5px; line-height:1.45;
    padding:14px; min-height:100vh;
  }
  h1{
    font-size:22px; margin:0; letter-spacing:5px; font-weight:300;
    background:linear-gradient(90deg,var(--accent),var(--accent2),var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .tagline{color:var(--dim); font-size:11.5px; letter-spacing:1px; margin-bottom:12px;}

  .layout{display:grid; grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr); gap:14px; align-items:start;}
  @media(max-width:980px){ .layout{grid-template-columns:1fr;} }

  .panel{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:13px;}
  .panel h2{
    margin:0 0 9px 0; font-size:11.5px; letter-spacing:2px; text-transform:uppercase;
    color:var(--accent2); border-bottom:1px solid var(--border); padding-bottom:7px; font-weight:600;
  }

  /* --- era header --- */
  #era-header{border:1px solid var(--border); border-radius:10px; padding:11px 14px; margin-bottom:12px;
    background:linear-gradient(90deg,rgba(127,216,255,.09),rgba(180,140,255,.05),transparent);}
  #era-nome{font-size:19px; letter-spacing:2px; font-weight:400;}
  #era-sub{color:var(--dim); font-size:11.5px; font-style:italic;}
  .era-meta{display:flex; gap:22px; flex-wrap:wrap; margin-top:7px; font-size:11.5px;}
  .era-meta div span{color:var(--dim); display:block; font-size:10px; letter-spacing:1px; text-transform:uppercase;}
  .era-meta div b{font-weight:600; color:var(--hot); font-size:13px;}
  #era-bar-wrap{height:3px; background:#0a0f20; border-radius:2px; margin-top:9px; overflow:hidden;}
  #era-bar{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .2s linear;}

  /* --- canvas --- */
  #canvas-wrap{position:relative; border:1px solid var(--border); border-radius:10px; overflow:hidden; background:#01030a; line-height:0;}
  canvas{width:100%; height:auto; display:block; cursor:crosshair;}
  #canvas-hint{
    position:absolute; left:0; right:0; bottom:0; padding:7px 11px; font-size:11.5px;
    background:linear-gradient(transparent,rgba(2,4,12,.92)); color:var(--dim); line-height:1.4;
  }

  /* --- resources --- */
  .res-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); gap:7px;}
  .res{background:rgba(255,255,255,.028); border:1px solid var(--border); border-radius:7px; padding:6px 9px;}
  .res span{display:block; font-size:9.5px; letter-spacing:.8px; text-transform:uppercase; color:var(--dim);}
  .res b{font-size:14px; font-weight:600;}
  .res.warn b{color:var(--danger);}
  .res.good b{color:var(--life);}
  .res.gold b{color:var(--gold);}

  /* --- controls --- */
  .ctrl{margin-bottom:12px;}
  .ctrl-label{display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:3px;}
  .ctrl-label b{color:var(--accent);}
  .ctrl-desc{font-size:11px; color:var(--dim); margin-top:3px; min-height:15px;}
  input[type=range]{width:100%; accent-color:var(--accent); margin:0;}
  button{
    background:linear-gradient(180deg,#1a2444,#121831); color:var(--text);
    border:1px solid #33406f; border-radius:7px; padding:8px 13px; cursor:pointer;
    font-size:12.5px; font-family:inherit; transition:.12s;
  }
  button:hover:not(:disabled){border-color:var(--accent); box-shadow:0 0 12px rgba(127,216,255,.22);}
  button:active:not(:disabled){transform:scale(.98);}
  button:disabled{opacity:.35; cursor:not-allowed;}
  button.go{width:100%; padding:12px; font-size:14px; letter-spacing:2px;
    background:linear-gradient(180deg,#26506b,#16304a); border-color:var(--accent);}
  button.act{background:linear-gradient(180deg,#2a2044,#1b1530); border-color:#5a4a8a;}
  .btn-row{display:flex; gap:7px; flex-wrap:wrap;}
  .btn-row button{flex:1; min-width:118px;}
  .cost{font-size:10px; color:var(--dim); display:block; margin-top:2px;}

  .forces .fbar{height:5px; background:#0a0f20; border-radius:3px; overflow:hidden; margin-top:2px;}
  .forces .fbar i{display:block; height:100%; border-radius:3px;}
  .f-grav i{background:#8e7bff;} .f-forte i{background:#ff8a5c;}
  .f-em i{background:#7fd8ff;}  .f-debole i{background:#6ee7a8;}

  #log{max-height:158px; overflow-y:auto; font-size:11.5px; color:var(--dim);
    border:1px solid var(--border); border-radius:7px; padding:7px; background:#05070f;}
  #log div{padding:2px 0; border-bottom:1px dashed #141b33;}
  #log div:last-child{border-bottom:none;}
  #log .hl{color:var(--hot);} #log .bad{color:var(--danger);} #log .ok{color:var(--life);}

  .footer{display:flex; gap:9px; align-items:center; margin-top:12px; flex-wrap:wrap; font-size:11.5px; color:var(--dim);}
  .speed{display:flex; gap:4px;}
  .speed button{padding:5px 11px; font-size:11.5px;}
  .speed button.on{border-color:var(--accent); background:linear-gradient(180deg,#22405c,#152539); color:var(--accent);}
  .hidden{display:none !important;}

  #overlay{position:fixed; inset:0; background:rgba(2,3,10,.94); display:flex; align-items:center; justify-content:center; z-index:99; padding:20px;}
  #overlay-box{background:var(--panel-solid); border:1px solid var(--accent2); border-radius:14px;
    padding:28px 32px; max-width:620px; box-shadow:0 0 80px rgba(180,140,255,.22);}
  #overlay-box h2{font-size:24px; margin:0 0 4px 0; letter-spacing:2px; color:var(--gold); border:none; text-transform:none;}
  #overlay-box .flavor{color:var(--dim); font-style:italic; margin-bottom:16px; line-height:1.6;}
  .final-stats{display:grid; grid-template-columns:1fr 1fr; gap:6px 18px; font-size:12.5px; margin-bottom:18px;}
  .final-stats div{display:flex; justify-content:space-between; border-bottom:1px dotted #232c50; padding:3px 0;}
  .final-stats b{color:var(--accent);}
</style>
</head>
<body>

<h1>COSMOGENESI</h1>
<div class="tagline">Un universo è un esperimento che si esegue una volta sola</div>

<div id="era-header">
  <div id="era-nome">Singolarità</div>
  <div id="era-sub">Prima del tempo</div>
  <div class="era-meta">
    <div><span>Età dell'universo</span><b id="m-eta">0</b></div>
    <div><span>Temperatura</span><b id="m-temp">∞</b></div>
    <div><span>Raggio</span><b id="m-raggio">0</b></div>
    <div><span>Entropia</span><b id="m-entropia">0%</b></div>
  </div>
  <div id="era-bar-wrap"><div id="era-bar"></div></div>
</div>

<div class="layout">
  <div>
    <div id="canvas-wrap">
      <canvas id="cv" width="900" height="540"></canvas>
      <div id="canvas-hint">La singolarità contiene tutto ciò che esisterà.</div>
    </div>

    <div class="panel" style="margin-top:12px;">
      <h2>Stato del Cosmo</h2>
      <div class="res-grid" id="res-grid"></div>
    </div>

    <div class="panel" style="margin-top:12px;">
      <h2>Cronaca Cosmica</h2>
      <div id="log"></div>
    </div>
  </div>

  <div>
    <div class="panel" id="panel-ctrl">
      <h2 id="ctrl-title">Costanti Fondamentali</h2>
      <div id="era-controls"></div>
    </div>

    <div class="panel forces" style="margin-top:12px;">
      <h2>Codice Sorgente dell'Universo</h2>
      <div id="forces-readout"></div>
    </div>
  </div>
</div>

<div class="footer">
  <div class="speed">
    <button data-sp="1" class="on">1×</button>
    <button data-sp="2">2×</button>
    <button data-sp="4">4×</button>
  </div>
  <button id="btn-reset">Ricomincia</button>
  <span id="meta-info"></span>
</div>

<div id="overlay" class="hidden">
  <div id="overlay-box">
    <h2 id="ov-title"></h2>
    <div class="flavor" id="ov-flavor"></div>
    <div class="final-stats" id="ov-stats"></div>
    <button class="go" id="ov-btn">Innesca un Nuovo Big Bang</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* =========================================================
   PERSISTENZA META (sopravvive alla morte dell'universo)
========================================================= */
const META_KEY = "cosmogenesi_meta_v1";
let meta = { comprensione:0, universi:0, finali:{} };
try{ const r = localStorage.getItem(META_KEY); if(r) meta = Object.assign(meta, JSON.parse(r)); }catch(e){}
function saveMeta(){ try{ localStorage.setItem(META_KEY, JSON.stringify(meta)); }catch(e){} }

/* =========================================================
   STATO DELL'UNIVERSO CORRENTE
========================================================= */
let U;
function nuovoUniverso(){
  return {
    era:0, eraT:0, eraDurata:0, finita:false,
    // costanti fondamentali (somma 100)
    gravita:25, forte:25, em:25, debole:25,
    lambda:30, eFolds:60,
    scala:1, fluttuazioni:0.8,
    // risorse
    energia: 1000 + Math.round(Math.sqrt(meta.comprensione)*110),
    quark:0, barioni:0,
    protoni:0, neutroni:0, elio:0, idrogeno:0,
    gas:0, gasIniziale:1, metalli:0,
    stellePiccole:0, stelleMassicce:0, stelleMorte:0,
    buchiNeri:0, massaBH:0, supernove:0,
    pianeti:0, abitabili:0,
    biosfere:0, complessita:0, estinzioni:0,
    civilta:0, kardashev:0, comprensioneRun:0,
    influenza:0,
    entropia:0,
    // parametri regolabili
    asimmetria:0, densitaBarionica:50, imf:20, feedback:50, classeStellare:1,
    // struttura
    perturbazioni:0, strutture:[], sogliaCollasso:0.62,
    // esito
    finale:null,
    tempo:0
  };
}

/* =========================================================
   UTILITÀ
========================================================= */
const $ = id => document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

function fmt(n,dec){
  if(!isFinite(n)||isNaN(n)) return "0";
  const neg=n<0; n=Math.abs(n);
  if(n<1000){
    const d = dec!==undefined?dec:(n<10&&!Number.isInteger(n)?1:0);
    return (neg?"-":"")+n.toFixed(d);
  }
  const u=["k","M","G","T","P","E","Z","Y"];
  let i=Math.min(Math.floor(Math.log10(n)/3),u.length);
  return (neg?"-":"")+(n/Math.pow(1000,i)).toFixed(2)+u[i-1];
}
// notazione scientifica per grandezze cosmiche
function sci(n){
  if(n<=0) return "0";
  const e=Math.floor(Math.log10(n));
  if(e>=-2&&e<4) return n.toFixed(Math.max(0,2-e));
  return (n/Math.pow(10,e)).toFixed(1)+"×10"+sup(e);
}
function sup(e){
  const m={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  return String(e).split('').map(c=>m[c]||c).join('');
}

const logTimes={};
function log(msg,cls,key,ms){
  if(key){ const now=Date.now(); if(logTimes[key]&&now-logTimes[key]<(ms||5000))return; logTimes[key]=now; }
  const el=$("log"), d=document.createElement("div");
  if(cls) d.className=cls;
  d.textContent=msg;
  el.appendChild(d);
  while(el.children.length>120) el.removeChild(el.firstChild);
  el.scrollTop=el.scrollHeight;
}

// moltiplicatori delle forze: 25 = universo "nostro" = 1.0×
const mG=()=>U.gravita/25, mF=()=>U.forte/25, mE=()=>U.em/25, mD=()=>U.debole/25;

/* =========================================================
   DEFINIZIONE DELLE ERE
   durata 0 = attesa di una decisione del giocatore
========================================================= */
const ERE = [
{
  id:"planck", nome:"Era di Planck", sub:"Tutte le forze sono una sola cosa", durata:0,
  eta:()=>"0 s", temp:()=>"10³² K", raggio:()=>"10⁻³⁵ m",
  hint:"Le quattro forze dormono ancora unificate. Come le separi definirà ogni cosa che accadrà dopo.",
  controlli: buildPlanck
},
{
  id:"inflazione", nome:"Inflazione", sub:"Lo spazio si dilata più veloce della luce", durata:0,
  eta:()=>"10⁻³⁶ s", temp:()=>"10²⁸ K", raggio:()=>"10⁻²⁶ m",
  hint:"Una frazione di secondo che decide quanto sarà vasto — e quanto grumoso — il tuo universo.",
  controlli: buildInflazione
},
{
  id:"quark", nome:"Era dei Quark", sub:"Plasma di quark e gluoni", durata:46,
  eta:()=>"10⁻⁶ s", temp:()=>"10¹² K", raggio:()=>"10⁹ m",
  hint:"Materia e antimateria si annichilano a vicenda. Solo un infinitesimo squilibrio può salvare la materia dall'oblio.",
  controlli: buildQuark, update: updQuark, esci: exitQuark
},
{
  id:"nucleo", nome:"Nucleosintesi", sub:"I primi nuclei atomici", durata:52,
  eta:()=>"3 minuti", temp:()=>"10⁹ K", raggio:()=>"10¹³ m",
  hint:"La finestra di fusione è brevissima. Ciò che non fondi ora resterà idrogeno per l'eternità.",
  controlli: buildNucleo, update: updNucleo, entra: enterNucleo, esci: exitNucleo
},
{
  id:"ricomb", nome:"Ricombinazione", sub:"L'universo diventa trasparente", durata:42,
  eta:()=>"380.000 anni", temp:()=>"3.000 K", raggio:()=>"10²³ m",
  hint:"La luce si libera: è la radiazione cosmica di fondo. Clicca sulla mappa per amplificare le fluttuazioni di densità — saranno i semi delle galassie.",
  controlli: buildRicomb, update: updRicomb, entra: enterRicomb
},
{
  id:"stelle", nome:"Prime Stelle", sub:"La fine dell'età oscura", durata:48,
  eta:()=>"200 milioni di anni", temp:()=>"50 K", raggio:()=>"10²⁴ m",
  hint:"La gravità vince sulla pressione: le nubi collassano e si accendono i primi soli.",
  controlli: buildStelle, update: updStelle, entra: enterStelle
},
{
  id:"galassie", nome:"Era Galattica", sub:"Il ciclo delle stelle e dei buchi neri", durata:105,
  eta:()=>"3 miliardi di anni", temp:()=>"20 K", raggio:()=>"10²⁵ m",
  hint:"Le stelle massicce muoiono in supernove: forgiano metalli e lasciano buchi neri che divorano il gas rimasto.",
  controlli: buildGalassie, update: updGalassie
},
{
  id:"pianeti", nome:"Era Planetaria", sub:"Mondi rocciosi dai resti stellari", durata:56,
  eta:()=>"9 miliardi di anni", temp:()=>"6 K", raggio:()=>"10²⁶ m",
  hint:"Solo dove i metalli sono abbondanti può condensarsi la roccia. Scegli attorno a quali soli seminare mondi.",
  controlli: buildPianeti, update: updPianeti
},
{
  id:"vita", nome:"Era della Vita", sub:"La chimica diventa biologia", durata:70,
  eta:()=>"11 miliardi di anni", temp:()=>"4 K", raggio:()=>"10²⁶ m",
  hint:"Su qualche mondo tiepido, la materia inizia a copiare sé stessa.",
  controlli: buildVita, update: updVita
},
{
  id:"mente", nome:"Era della Coscienza", sub:"L'universo apre gli occhi", durata:74,
  eta:()=>"13,8 miliardi di anni", temp:()=>"2,7 K", raggio:()=>"10²⁶ m",
  hint:"Alcune biosfere generano menti capaci di guardare il cielo e chiedersi da dove vengano.",
  controlli: buildMente, update: updMente
},
{
  id:"destino", nome:"Destino", sub:"La fine di tutte le cose", durata:0,
  eta:()=>"10¹⁰⁰ anni", temp:()=>"~0 K", raggio:()=>"∞",
  hint:"Ogni universo finisce. Ciò che conta è cosa ha generato mentre durava.",
  controlli: ()=>{}
}
];

/* =========================================================
   GRIGLIA DI DENSITÀ (la ragnatela cosmica)
========================================================= */
const COLS=52, ROWS=32;
let densita = [];
function generaDensita(amp){
  densita = [];
  const oct=[{s:5,w:.55},{s:11,w:.3},{s:23,w:.15}];
  const seeds = oct.map(()=>Array.from({length:64},()=>Math.random()));
  for(let j=0;j<ROWS;j++){
    densita[j]=[];
    for(let i=0;i<COLS;i++){
      let v=0;
      oct.forEach((o,k)=>{
        const x=i/COLS*o.s, y=j/ROWS*o.s;
        const a=seeds[k][(Math.floor(x)+Math.floor(y)*7)%64];
        const b=seeds[k][(Math.floor(x)+1+Math.floor(y)*7)%64];
        const c=seeds[k][(Math.floor(x)+(Math.floor(y)+1)*7)%64];
        const fx=x-Math.floor(x), fy=y-Math.floor(y);
        v+=o.w*lerp(lerp(a,b,fx),c,fy);
      });
      densita[j][i]=clamp(0.5+(v-0.5)*amp*1.6,0,1);
    }
  }
}

/* =========================================================
   CONTROLLI PER ERA
========================================================= */
function setControls(html){ $("era-controls").innerHTML = html; }

/* --- ERA 0: costanti fondamentali --- */
const DESCR_FORZE = {
  gravita:"Attrae la materia: governa il collasso delle nubi, la nascita delle stelle e dei buchi neri.",
  forte:"Lega i nuclei: decide quanti elementi pesanti la fusione riesce a costruire.",
  em:"Governa atomi, luce e chimica: senza di essa non esistono molecole né vita.",
  debole:"Regola il decadimento e le supernove: senza di essa i metalli restano sepolti nelle stelle."
};
function buildPlanck(){
  setControls(`
    <div style="font-size:11.5px;color:var(--dim);margin-bottom:11px;">
      Distribuisci 100 unità di simmetria fra le quattro forze. Il totale è fisso: potenziare una significa indebolire le altre. Non potrai più cambiarle.
    </div>
    ${["gravita","forte","em","debole"].map(f=>`
      <div class="ctrl">
        <div class="ctrl-label"><span>${{gravita:"Gravità",forte:"Nucleare Forte",em:"Elettromagnetica",debole:"Nucleare Debole"}[f]}</span><b id="lab-${f}">25</b></div>
        <input type="range" id="sl-${f}" min="0" max="70" value="25">
        <div class="ctrl-desc">${DESCR_FORZE[f]}</div>
      </div>`).join("")}
    <div class="ctrl-desc" id="planck-warn" style="color:var(--gold);min-height:32px;"></div>
    <button class="go" id="btn-bang">FRATTURA LA SIMMETRIA</button>
  `);
  ["gravita","forte","em","debole"].forEach(f=>{
    $("sl-"+f).addEventListener("input",e=>{
      U[f]=+e.target.value; normalizzaForze(f); aggiornaPlanck();
    });
  });
  $("btn-bang").addEventListener("click",()=>{
    log("La simmetria si frattura: quattro forze distinte emergono dal vuoto.","hl");
    avanzaEra();
  });
  aggiornaPlanck();
}
function normalizzaForze(fisso){
  const tutte=["gravita","forte","em","debole"];
  const altre=tutte.filter(f=>f!==fisso);
  const resto=100-U[fisso];
  const somma=altre.reduce((a,f)=>a+U[f],0);
  if(somma<=0){ altre.forEach((f,i)=>U[f]= i===0?resto:0); }
  else altre.forEach(f=>{ U[f]=Math.round(U[f]/somma*resto); });
  const drift=100-tutte.reduce((a,f)=>a+U[f],0);
  U[altre[0]]=Math.max(0,U[altre[0]]+drift);
}
function aggiornaPlanck(){
  ["gravita","forte","em","debole"].forEach(f=>{
    const s=$("sl-"+f), l=$("lab-"+f);
    if(s){ s.value=U[f]; l.textContent=U[f]; }
  });
  const w=$("planck-warn"); if(!w) return;
  let avvisi=[];
  if(U.gravita<8) avvisi.push("Gravità troppo debole: la materia non collasserà mai in stelle.");
  if(U.forte<8) avvisi.push("Forza forte insufficiente: i nuclei non reggeranno.");
  if(U.em<8) avvisi.push("Elettromagnetismo esiguo: niente atomi stabili, niente chimica.");
  if(U.debole<8) avvisi.push("Forza debole quasi assente: nessuna supernova disperderà i metalli.");
  if(U.gravita>50) avvisi.push("Gravità estrema: rischio di collasso precoce in buchi neri.");
  w.textContent = avvisi.length? "⚠ "+avvisi.join(" ") : "Configurazione stabile: un universo plausibile.";
  w.style.color = avvisi.length? "var(--gold)":"var(--life)";
  renderForze();
}

/* --- ERA 1: inflazione --- */
function buildInflazione(){
  setControls(`
    <div style="font-size:11.5px;color:var(--dim);margin-bottom:11px;">
      In 10⁻³² secondi lo spazio si espanderà di un fattore inimmaginabile. Più a lungo dura, più l'universo sarà vasto — ma anche più liscio, e da un universo perfettamente liscio non nasce nulla.
    </div>
    <div class="ctrl">
      <div class="ctrl-label"><span>Durata dell'inflazione (e-folds)</span><b id="lab-ef">60</b></div>
      <input type="range" id="sl-ef" min="40" max="80" value="60">
      <div class="ctrl-desc" id="desc-ef"></div>
    </div>
    <div class="ctrl">
      <div class="ctrl-label"><span>Costante cosmologica Λ</span><b id="lab-la">30</b></div>
      <input type="range" id="sl-la" min="0" max="100" value="30">
      <div class="ctrl-desc" id="desc-la"></div>
    </div>
    <button class="go" id="btn-inf">ESPANDI LO SPAZIO</button>
  `);
  const upd=()=>{
    U.eFolds=+$("sl-ef").value; U.lambda=+$("sl-la").value;
    $("lab-ef").textContent=U.eFolds; $("lab-la").textContent=U.lambda;
    U.scala = 1+(U.eFolds-40)/10;
    U.fluttuazioni = clamp(1.35-(U.eFolds-40)/44, 0.25, 1.35);
    $("desc-ef").textContent = `Materia disponibile ×${U.scala.toFixed(1)} · Fluttuazioni ${(U.fluttuazioni*100/1.35).toFixed(0)}% — ${U.fluttuazioni>0.95?"universo molto grumoso: strutture ovunque, ma piccolo":U.fluttuazioni<0.45?"universo quasi liscio: vasto ma quasi sterile":"equilibrio fra vastità e struttura"}`;
    $("desc-la").textContent = U.lambda>78?"Energia oscura dominante: lo spazio si lacererà (Big Rip).":
      U.lambda>52?"Espansione accelerata: le strutture smetteranno presto di formarsi.":
      U.lambda<10?"Quasi nessuna energia oscura: la gravità potrebbe far ricollassare tutto.":
      "Espansione moderata: l'universo avrà tempo per evolvere.";
  };
  $("sl-ef").addEventListener("input",upd);
  $("sl-la").addEventListener("input",upd);
  $("btn-inf").addEventListener("click",()=>{
    generaDensita(U.fluttuazioni);
    U.quark = U.energia*U.scala*12;
    log(`Inflazione completata: ${U.eFolds} e-folds. Lo spazio è ora ${(U.scala).toFixed(1)}× più capiente del minimo.`,"hl");
    log("Il vuoto si riempie di un plasma incandescente di quark e gluoni.");
    avanzaEra();
  });
  upd();
}

/* --- ERA 2: quark / bariogenesi --- */
function buildQuark(){
  setControls(`
    <div style="font-size:11.5px;color:var(--dim);margin-bottom:11px;">
      Quark e antiquark si annichilano in fotoni. Se la simmetria fosse perfetta non resterebbe nulla: imprimi uno squilibrio CP per salvare una frazione di materia. Mantenerlo costa energia, e l'energia si diluisce con l'espansione.
    </div>
    <div class="ctrl">
      <div class="ctrl-label"><span>Asimmetria materia/antimateria</span><b id="lab-as">0</b></div>
      <input type="range" id="sl-as" min="0" max="100" value="0">
      <div class="ctrl-desc" id="desc-as"></div>
    </div>
    <div class="btn-row">
      <button class="act" id="btn-burst">Impulso di Bariogenesi<span class="cost">120 energia</span></button>
    </div>
  `);
  $("sl-as").addEventListener("input",e=>{ U.asimmetria=+e.target.value; aggiornaQuark(); });
  $("btn-burst").addEventListener("click",()=>{
    if(U.energia>=120){
      U.energia-=120;
      const b=U.quark*0.09;
      U.quark-=b; U.barioni+=b;
      log("Impulso di bariogenesi: "+fmt(b)+" barioni strappati all'annichilazione.","ok");
    }
  });
  aggiornaQuark();
}
function aggiornaQuark(){
  const d=$("desc-as"); if(!d) return;
  const costo=(U.asimmetria/100)*22;
  d.textContent = U.asimmetria===0 ? "Nessuno squilibrio: tutta la materia svanirà in luce."
    : `Costo ${costo.toFixed(0)} energia/s · conversione ${(U.asimmetria*0.055).toFixed(1)}%/s del plasma in barioni.`;
  if($("lab-as")) $("lab-as").textContent=U.asimmetria;
}
function updQuark(dt){
  const costo=(U.asimmetria/100)*22*dt;
  if(U.energia>=costo){
    U.energia-=costo;
    const conv = U.quark*(U.asimmetria/100)*0.055*dt*mF();
    U.quark-=conv; U.barioni+=conv;
  } else if(U.asimmetria>0){
    U.asimmetria=Math.max(0,U.asimmetria-40*dt);
    const s=$("sl-as"); if(s) s.value=U.asimmetria;
    aggiornaQuark();
    log("Energia esaurita: l'asimmetria CP sta collassando.","bad","asim",6000);
  }
  // il plasma si annichila comunque, lentamente
  U.quark-=U.quark*0.04*dt;
  U.energia-=U.energia*0.012*dt; // redshift
}
function exitQuark(){
  U.quark=0;
  if(U.barioni<1){
    finisci("vuoto");
    return true;
  }
  log("Annichilazione completata. Sopravvivono "+fmt(U.barioni)+" barioni: sarà tutta la materia che l'universo avrà mai.","hl");
}

/* --- ERA 3: nucleosintesi --- */
function enterNucleo(){
  const nFrac = clamp(0.14 + (U.debole-25)/25*0.05, 0.04, 0.28);
  U.neutroni = U.barioni*nFrac;
  U.protoni = U.barioni*(1-nFrac);
  log(`Protoni e neutroni si congelano nel rapporto ${(1/nFrac).toFixed(1)}:1.`);
}
function buildNucleo(){
  setControls(`
    <div style="font-size:11.5px;color:var(--dim);margin-bottom:11px;">
      Per pochi minuti la temperatura permette la fusione. I neutroni liberi decadono senza sosta: ogni istante perso è elio che non esisterà mai.
    </div>
    <div class="ctrl">
      <div class="ctrl-label"><span>Densità barionica</span><b id="lab-db">50</b></div>
      <input type="range" id="sl-db" min="0" max="100" value="50">
      <div class="ctrl-desc" id="desc-db"></div>
    </div>
    <div class="ctrl">
      <div class="ctrl-label"><span>Finestra di fusione</span><b id="lab-win">0%</b></div>
      <div id="era-bar-wrap" style="margin-top:0;"><div id="win-bar" style="height:100%;width:0%;background:linear-gradient(90deg,var(--hot),var(--danger));"></div></div>
    </div>
    <div class="btn-row">
      <button class="act" id="btn-comp">Comprimi il Plasma<span class="cost">80 energia · fusione istantanea</span></button>
    </div>
  `);
  $("sl-db").addEventListener("input",e=>{ U.densitaBarionica=+e.target.value; aggiornaNucleo(); });
  $("btn-comp").addEventListener("click",()=>{
    if(U.energia>=80){
      U.energia-=80;
      const f=Math.min(U.neutroni,U.protoni)*0.12;
      fondi(f);
      log("Compressione: fusione accelerata di "+fmt(f*4)+" nuclei di elio.","ok");
    }
  });
  aggiornaNucleo();
}
function aggiornaNucleo(){
  const d=$("desc-db"); if(!d) return;
  d.textContent = U.densitaBarionica>72?"Densità alta: fusione rapida, ma più elio e meno idrogeno per le stelle future."
    : U.densitaBarionica<28?"Densità bassa: fusione lenta, resterà molto idrogeno incombusto."
    : "Densità equilibrata: buon compromesso fra elio e idrogeno.";
  if($("lab-db")) $("lab-db").textContent=U.densitaBarionica;
}
function fondi(quanti){
  quanti=Math.max(0,Math.min(quanti,Math.min(U.neutroni/2,U.protoni/2)));
  U.neutroni-=quanti*2; U.protoni-=quanti*2; U.elio+=quanti*4;
}
function updNucleo(dt){
  const p=U.eraT/U.eraDurata;
  const finestra=Math.exp(-Math.pow((p-0.45)/0.26,2));
  const tasso = finestra * (0.35+U.densitaBarionica/100*0.75) * mF() * 0.16;
  fondi(Math.min(U.neutroni/2,U.protoni/2)*tasso*dt);
  // decadimento dei neutroni liberi
  U.neutroni -= U.neutroni*(0.012*mD()+0.006)*dt;
  U.energia -= U.energia*0.01*dt;
  if($("win-bar")){ $("win-bar").style.width=(finestra*100).toFixed(0)+"%"; $("lab-win").textContent=(finestra*100).toFixed(0)+"%"; }
}
function exitNucleo(){
  U.idrogeno = U.protoni;
  U.gas = U.idrogeno + U.elio;
  U.gasIniziale = Math.max(1,U.gas);
  U.protoni=0; U.neutroni=0;
  const frazioneElio = U.gas>0 ? U.elio/U.gas : 0;
  log(`Nucleosintesi conclusa: ${(frazioneElio*100).toFixed(1)}% di elio in massa. ${frazioneElio>0.18&&frazioneElio<0.32?"Un valore straordinariamente simile a quello del nostro universo.":frazioneElio<0.1?"Un universo poverissimo di elio.":"Un universo insolitamente ricco di elio."}`,"hl");
  if(U.gas<10){ finisci("sterile"); return true; }
}

/* --- ERA 4: ricombinazione --- */
function enterRicomb(){
  U.perturbazioni = 18 + Math.floor(meta.comprensione/3);
  log("Gli elettroni si legano ai nuclei: nascono i primi atomi e l'universo diventa trasparente.","hl");
}
function buildRicomb(){
  setControls(`
    <div style="font-size:11.5px;color:var(--dim);margin-bottom:11px;">
      La luce fossile rivela le impronte lasciate dall'inflazione. Clicca sulle regioni più dense della mappa per amplificarle: dove la densità supera la soglia di collasso nasceranno le galassie.
    </div>
    <div class="res-grid">
      <div class="res"><span>Perturbazioni</span><b id="lab-pert">0</b></div>
      <div class="res"><span>Regioni sopra soglia</span><b id="lab-reg">0</b></div>
      <div class="res"><span>Soglia di collasso</span><b id="lab-sog">0</b></div>
    </div>
    <div class="ctrl-desc" style="margin-top:9px;">Una gravità più intensa abbassa la soglia: serve meno densità perché una nube collassi.</div>
  `);
  aggiornaRicomb();
}
function contaRegioni(){
  let n=0;
  for(let j=0;j<ROWS;j++) for(let i=0;i<COLS;i++) if(densita[j][i]>U.sogliaCollasso) n++;
  return n;
}
function aggiornaRicomb(){
  U.sogliaCollasso = clamp(0.815-(U.gravita-25)/25*0.10, 0.55, 0.95);
  if($("lab-pert")){
    $("lab-pert").textContent=U.perturbazioni;
    $("lab-reg").textContent=contaRegioni();
    $("lab-sog").textContent=U.sogliaCollasso.toFixed(2);
  }
}
function updRicomb(){ aggiornaRicomb(); }

/* --- ERA 5: prime stelle --- */
function enterStelle(){
  U.strutture=[];
  for(let j=0;j<ROWS;j++) for(let i=0;i<COLS;i++){
    if(densita[j][i]>U.sogliaCollasso){
      // scostamento casuale dal centro della cella: senza di esso le galassie
      // si allineerebbero visibilmente sul reticolo della griglia
      U.strutture.push({i,j,peso:densita[j][i]-U.sogliaCollasso+0.05,fase:Math.random()*6.28,
        ox:(Math.random()-0.5)*1.7, oy:(Math.random()-0.5)*1.7, scala:0.55+Math.random()*0.95});
    }
  }
  if(U.strutture.length===0){ finisci("diffuso"); return; }
  log(`${U.strutture.length} nubi superano la soglia di collasso e iniziano a contrarsi.`,"hl");
}
function buildStelle(){
  setControls(`
    <div style="font-size:11.5px;color:var(--dim);margin-bottom:11px;">
      La funzione di massa iniziale decide che tipo di stelle nasceranno. È la scelta più importante dell'intero universo: le stelle massicce vivono pochissimo ma esplodono, forgiando i metalli senza i quali non esistono pianeti né vita.
    </div>
    <div class="ctrl">
      <div class="ctrl-label"><span>Frazione di stelle massicce</span><b id="lab-imf">20%</b></div>
      <input type="range" id="sl-imf" min="0" max="80" value="20">
      <div class="ctrl-desc" id="desc-imf"></div>
    </div>
  `);
  $("sl-imf").addEventListener("input",e=>{ U.imf=+e.target.value; aggiornaIMF(); });
  aggiornaIMF();
}
function aggiornaIMF(){
  const d=$("desc-imf"); if(!d) return;
  if($("lab-imf")) $("lab-imf").textContent=U.imf+"%";
  d.textContent = U.imf>52?"Dominano i giganti: metalli in abbondanza e molti buchi neri, ma il gas si esaurirà in fretta e le supernove sterilizzeranno i mondi."
    : U.imf<10?"Quasi solo nane rosse: stelle longeve e stabili, ma pochissimi metalli — i pianeti rocciosi resteranno rari."
    : "Miscela equilibrata: metalli sufficienti e stelle longeve attorno a cui la vita può maturare.";
}
// Il gas è la risorsa finita che governa tutto il resto: viene consumato come
// frazione di ciò che resta, così la penuria arriva sempre, qualunque sia la
// scala dell'universo generato nelle ere precedenti.
function formazioneStellare(dt){
  const agn = 1/(1+U.massaBH/Math.max(1,U.gasIniziale)*7);
  const fb = 1-(U.feedback/100)*0.4;
  const lam = 1/(1+Math.pow(U.lambda/55,3)*(U.tempo/110));
  const struttura = clamp(U.strutture.length/45, 0.12, 2.4);
  const tasso = 0.0115*mG()*struttura*agn*fb*lam*(1-U.entropia*0.5);
  const consumo = Math.min(U.gas, U.gas*tasso*dt);
  if(consumo<=0) return;
  U.gas -= consumo;
  // parte dei metalli viene sepolta nelle nuove stelle: senza questo la
  // metallicità crescerebbe senza limite mentre il gas si esaurisce
  U.metalli = Math.max(0, U.metalli - consumo*metallicita()*0.55);
  const costoMedio = 1+(U.imf/100)*6;
  const nuove = consumo/costoMedio;
  U.stelleMassicce += nuove*(U.imf/100);
  U.stellePiccole  += nuove*(1-U.imf/100);
}
function morteStelleMassicce(dt){
  const morte = U.stelleMassicce*0.075*dt;
  if(morte<=0) return;
  U.stelleMassicce-=morte; U.stelleMorte+=morte;
  U.supernove+=morte;
  U.metalli += morte*0.06*mF()*(0.25+mD()*0.75);
  U.gas += morte*2.6*(0.4+U.feedback/100*0.6);
  const bh = morte*clamp(0.12+ (U.imf/100)*0.28 + (mG()-1)*0.1, 0.02, 0.55);
  U.buchiNeri += bh;
  U.entropia = clamp(U.entropia + morte*0.00028, 0, 1);
}
function formazionePianeti(dt,scala){
  const z=metallicita();
  const stelle=U.stellePiccole+U.stelleMassicce;
  const nuovi = stelle*z*0.3*dt*mE()*scala;
  U.pianeti+=nuovi;
  const bonusClasse=[0.85,1.25,0.5][U.classeStellare];
  const finestraZ = Math.exp(-Math.pow((Math.log10(Math.max(z,1e-6))+1.7)/0.72,2));
  U.abitabili += nuovi*0.16*bonusClasse*finestraZ*clamp(mE(),0.2,1.7);
}
function updStelle(dt){
  formazioneStellare(dt);
  if(U.eraT>U.eraDurata*0.45){
    morteStelleMassicce(dt);
    if(U.supernove>0 && U.metalli>0) log("Le prime supernove disperdono metalli nel mezzo intergalattico.","ok","sn1",99999);
  }
}

/* --- ERA 6: galassie --- */
function buildGalassie(){
  setControls(`
    <div style="font-size:11.5px;color:var(--dim);margin-bottom:11px;">
      Il ciclo si è avviato: gas → stelle → supernove → metalli. Ma il gas è finito, e i buchi neri ne divorano una parte per sempre.
    </div>
    <div class="ctrl">
      <div class="ctrl-label"><span>Frazione di stelle massicce</span><b id="lab-imf">20%</b></div>
      <input type="range" id="sl-imf" min="0" max="80" value="${U.imf}">
      <div class="ctrl-desc" id="desc-imf"></div>
    </div>
    <div class="ctrl">
      <div class="ctrl-label"><span>Feedback stellare</span><b id="lab-fb">50%</b></div>
      <input type="range" id="sl-fb" min="0" max="100" value="${U.feedback}">
      <div class="ctrl-desc" id="desc-fb"></div>
    </div>
    <div class="btn-row">
      <button class="act" id="btn-merge">Fusione Galattica<span class="cost">unisce due strutture: più massa, più stelle</span></button>
    </div>
  `);
  $("sl-imf").addEventListener("input",e=>{ U.imf=+e.target.value; aggiornaIMF(); });
  $("sl-fb").addEventListener("input",e=>{ U.feedback=+e.target.value; aggiornaFB(); });
  $("btn-merge").addEventListener("click",()=>{
    if(U.strutture.length>2){
      const a=U.strutture.pop();
      const b=U.strutture[Math.floor(Math.random()*U.strutture.length)];
      b.peso+=a.peso*0.85;
      U.gas+=U.gasIniziale*0.012;
      U.massaBH+=U.massaBH*0.05;
      log("Due galassie si fondono: un'onda di formazione stellare attraversa il gas compresso.","ok");
    }
  });
  aggiornaIMF(); aggiornaFB();
}
function aggiornaFB(){
  const d=$("desc-fb"); if(!d) return;
  if($("lab-fb")) $("lab-fb").textContent=U.feedback+"%";
  d.textContent = U.feedback>70?"Venti stellari violenti: il gas viene espulso dalle galassie, la formazione stellare rallenta ma i metalli si diffondono ovunque."
    : U.feedback<30?"Feedback debole: il gas resta concentrato e brucia in fretta, ma i metalli restano intrappolati."
    : "Feedback moderato: il gas viene riciclato con efficienza.";
}
function updGalassie(dt){
  formazioneStellare(dt);
  morteStelleMassicce(dt);
  // morte lenta delle piccole
  const m=U.stellePiccole*0.004*dt;
  U.stellePiccole-=m; U.stelleMorte+=m; U.gas+=m*0.35;
  // accrescimento dei buchi neri: gas perso per sempre
  if(U.buchiNeri>0&&U.gas>0){
    const acc=Math.min(U.gas, U.buchiNeri*0.055*mG()*dt);
    U.gas-=acc; U.massaBH+=acc;
    if(U.massaBH>U.gasIniziale*0.14) log("I nuclei galattici attivi irradiano tanta energia da spegnere la formazione stellare attorno a sé.","bad","agn",25000);
  }
  U.entropia=clamp(U.entropia+0.0009*dt,0,1);
  if(U.lambda>78 && U.eraT>U.eraDurata*0.5){ finisci("rip"); }
}

/* --- ERA 7: pianeti --- */
function buildPianeti(){
  const opz=[
    {i:0,n:"Nane rosse",d:"Vivono mille miliardi di anni: tempo infinito per evolvere, ma i mondi sono bloccati in rotazione sincrona e bombardati da brillamenti."},
    {i:1,n:"Stelle solari",d:"Dieci miliardi di anni di stabilità: il compromesso che ha funzionato nel nostro universo."},
    {i:2,n:"Stelle massicce",d:"Luminose e generose di energia, ma esplodono prima che la biologia possa farsi complessa."}
  ];
  setControls(`
    <div style="font-size:11.5px;color:var(--dim);margin-bottom:11px;">
      La polvere ricca di metalli si condensa in mondi. Scegli attorno a quale tipo di sole concentrare la formazione planetaria.
    </div>
    <div class="ctrl">
      <div class="ctrl-label"><span>Metallicità del mezzo</span><b id="lab-z">0</b></div>
      <div class="ctrl-desc" id="desc-z"></div>
    </div>
    ${opz.map(o=>`<div class="ctrl"><button class="act cls-btn" data-c="${o.i}" style="width:100%;text-align:left;${U.classeStellare===o.i?'border-color:var(--accent);':''}">${o.n}<span class="cost">${o.d}</span></button></div>`).join("")}
  `);
  document.querySelectorAll(".cls-btn").forEach(b=>b.addEventListener("click",()=>{
    U.classeStellare=+b.dataset.c;

  }));
  aggiornaZ();
}
function metallicita(){ return U.gas+U.metalli>0 ? U.metalli/(U.gas+U.metalli) : 0; }
function aggiornaZ(){
  const z=metallicita(); const d=$("desc-z");
  if($("lab-z")) $("lab-z").textContent=(z*100).toFixed(2)+"%";
  if(d) d.textContent = z<0.002?"Metallicità quasi nulla: si formeranno soltanto giganti gassosi."
    : z<0.012?"Metallicità bassa: pochi mondi rocciosi, per lo più aridi."
    : z<0.05?"Metallicità favorevole: mondi rocciosi con acqua e atmosfere."
    : "Metallicità altissima: sistemi affollati, instabili e bombardati da asteroidi.";
}
function updPianeti(dt){
  formazioneStellare(dt);
  morteStelleMassicce(dt);
  formazionePianeti(dt,1);
  aggiornaZ();
  if(U.pianeti>1&&U.abitabili<0.01) log("Mondi ovunque, ma nessuno con acqua liquida in superficie.","bad","noab",30000);
}

/* --- ERA 8: vita --- */
function buildVita(){
  setControls(`
    <div style="font-size:11.5px;color:var(--dim);margin-bottom:11px;">
      Su alcuni mondi la chimica inizia a replicarsi. Hai accumulato abbastanza struttura da poter esercitare una lieve influenza sul cosmo.
    </div>
    <div class="res-grid">
      <div class="res good"><span>Biosfere</span><b id="lab-bio">0</b></div>
      <div class="res"><span>Complessità media</span><b id="lab-cx">0</b></div>
      <div class="res warn"><span>Estinzioni</span><b id="lab-ext">0</b></div>
    </div>
    <div class="btn-row" style="margin-top:11px;">
      <button class="act" id="b-pan">Panspermia<span class="cost">15 influenza · semina la vita fra i mondi</span></button>
      <button class="act" id="b-scudo">Scudi Magnetici<span class="cost">20 influenza · riduce le estinzioni</span></button>
      <button class="act" id="b-salto">Salto Evolutivo<span class="cost">30 influenza · accelera la complessità</span></button>
    </div>
  `);
  $("b-pan").addEventListener("click",()=>spendi(15,()=>{
    U.biosfere+=Math.max(1,U.biosfere*0.35);
    log("Panspermia: spore attraversano lo spazio e attecchiscono su mondi vergini.","ok");
  }));
  $("b-scudo").addEventListener("click",()=>spendi(20,()=>{
    U.scudi=(U.scudi||0)+1;
    log("Campi magnetici planetari rinforzati: le radiazioni non sterilizzeranno più le superfici.","ok");
  }));
  $("b-salto").addEventListener("click",()=>spendi(30,()=>{
    U.complessita+=0.9;
    log("Un salto evolutivo: la simbiosi genera cellule complesse.","ok");
  }));
}
function spendi(costo,fn){
  if(U.influenza>=costo){ U.influenza-=costo; fn(); }
}
function updVita(dt){
  formazioneStellare(dt);
  morteStelleMassicce(dt);
  formazionePianeti(dt,0.5);
  const z=metallicita();
  const chimica = clamp(mE(),0,2.2)*clamp(1-Math.abs(z-0.03)*9,0.15,1);
  const nascite = U.abitabili*0.0055*chimica*dt;
  U.biosfere += nascite;
  // le supernove vicine sterilizzano
  const rischio = U.stelleMassicce*0.00016*dt/(1+(U.scudi||0)*1.6);
  if(U.biosfere>0 && rischio>0){
    const perse=Math.min(U.biosfere,U.biosfere*rischio);
    if(perse>0.001){
      U.biosfere-=perse; U.estinzioni+=perse;
      log("Una supernova vicina spazza via l'atmosfera di mondi abitati.","bad","ext",18000);
    }
  }
  if(U.biosfere>0){
    const tempoDisponibile=[1.35,1.0,0.45][U.classeStellare];
    U.complessita += 0.055*dt*tempoDisponibile*clamp(mE(),0.3,1.6)*(1-U.entropia*0.5);
  }
  U.influenza += (U.biosfere*0.008+U.complessita*0.04)*dt;
  U.entropia=clamp(U.entropia+0.0008*dt,0,1);
  if($("lab-bio")){
    $("lab-bio").textContent=fmt(U.biosfere,1);
    $("lab-cx").textContent=U.complessita.toFixed(2);
    $("lab-ext").textContent=fmt(U.estinzioni,1);
  }
}

function updMente(dt){
  formazioneStellare(dt);
  morteStelleMassicce(dt);
  formazionePianeti(dt,0.25);
  const soglia=1.2;
  if(U.complessita>soglia){
    U.civilta += U.biosfere*0.0005*(U.complessita-soglia)*dt;
  }
  U.biosfere += U.abitabili*0.0012*clamp(mE(),0,2)*dt;
  // grande filtro
  if(U.civilta>0.5 && Math.random()<0.02*dt){
    const perse=U.civilta*0.2;
    U.civilta-=perse;
    log("Una civiltà si autodistrugge prima di lasciare il proprio sistema.","bad");
  }
  U.kardashev = Math.max(U.kardashev, U.civilta>0.1?1:0);
  U.comprensioneRun += U.civilta*0.03*dt*(1+(U.dyson||0)*0.4+(U.bhc||0)*0.8);
  U.influenza += (U.biosfere*0.008+U.complessita*0.04+U.civilta*0.12)*dt;
  U.complessita += 0.03*dt*(1-U.entropia*0.6);
  U.entropia=clamp(U.entropia+0.0011*dt,0,1);
  if($("lab-civ")){
    $("lab-civ").textContent=fmt(U.civilta,2);
    $("lab-comp").textContent=fmt(U.comprensioneRun,1);
    $("lab-kar").textContent="Tipo "+U.kardashev;
    $("desc-mente").textContent = U.civilta<0.05?"Nessuna civiltà ha ancora superato la soglia tecnologica."
      : U.kardashev>=3?"Le civiltà hanno imparato a sopravvivere alla morte delle stelle."
      : "Le civiltà si espandono lentamente fra i mondi.";
  }
}

/* =========================================================
   MOTORE DELLE ERE
========================================================= */
function avanzaEra(){
  const era=ERE[U.era];
  if(era.esci && era.esci()) return;   // esci() può concludere la partita
  if(U.era>=ERE.length-1) return;
  U.era++;
  U.eraT=0; U.eraDurata=ERE[U.era].durata;
  const n=ERE[U.era];
  if(n.entra && n.entra()===false) return;
  if(U.finita) return;
  log("— "+n.nome.toUpperCase()+" —","hl");
  $("era-nome").textContent=n.nome;
  $("era-sub").textContent=n.sub;
  $("canvas-hint").textContent=n.hint;
  $("ctrl-title").textContent = n.nome;
  n.controlli();
  if(n.id==="destino") risolviDestino();
}

function tick(dt){
  if(U.finita) return;
  U.tempo+=dt;
  const era=ERE[U.era];
  if(era.update) era.update(dt);
  if(era.durata>0){
    U.eraT+=dt;
    if(U.eraT>=era.durata) avanzaEra();
  }
}

function risolviDestino(){
  let id;
  if(U.kardashev>=3 && U.civilta>0.5) id="trascendenza";
  else if(U.civilta>0.05) id="coscienza";
  else if(U.biosfere>0.5) id="vita";
  else if(U.lambda<10 && U.stellePiccole+U.stelleMassicce>0) id="crunch";
  else id="freddo";
  finisci(id);
}
function finisci(id){
  if(U.finita) return;
  U.finita=true; U.finale=id;
  const f=FINALI[id]||FINALI.freddo;
  const guadagno = Math.floor(
    U.comprensioneRun + U.civilta*1.5 + U.biosfere*0.15 + U.complessita*2 +
    (U.stellePiccole+U.stelleMassicce)*0.002 + (id==="trascendenza"?25:id==="coscienza"?10:0)
  );
  meta.comprensione += Math.max(0,guadagno);
  meta.universi++;
  meta.finali[id]=(meta.finali[id]||0)+1;
  saveMeta();
  $("ov-title").textContent=f.t;
  $("ov-flavor").textContent=f.f;
  $("ov-stats").innerHTML=[
    ["Barioni sopravvissuti",fmt(U.barioni)],
    ["Elio primordiale",(U.gasIniziale>1?(U.elio/U.gasIniziale*100).toFixed(1):"0")+"%"],
    ["Galassie formate",fmt(U.strutture.length)],
    ["Stelle accese",fmt(U.stellePiccole+U.stelleMassicce+U.stelleMorte)],
    ["Supernove",fmt(U.supernove)],
    ["Buchi neri",fmt(U.buchiNeri)],
    ["Metallicità finale",(metallicita()*100).toFixed(2)+"%"],
    ["Pianeti",fmt(U.pianeti)],
    ["Mondi abitabili",fmt(U.abitabili,1)],
    ["Biosfere",fmt(U.biosfere,1)],
    ["Civiltà",fmt(U.civilta,2)],
    ["Comprensione acquisita","+"+guadagno]
  ].map(r=>`<div><span>${r[0]}</span><b>${r[1]}</b></div>`).join("");
  $("overlay").classList.remove("hidden");
  log("★ "+f.t+" ★","hl");
}

function renderRisorse(){
  const e=ERE[U.era].id;
  let r=[];
  const add=(n,v,c)=>r.push({n,v,c});
  if(["planck","inflazione","quark","nucleo"].includes(e)) add("Energia",fmt(U.energia));
  if(e==="quark"){ add("Plasma di quark",fmt(U.quark)); add("Barioni",fmt(U.barioni),"good"); }
  if(e==="nucleo"){ add("Protoni",fmt(U.protoni)); add("Neutroni",fmt(U.neutroni),"warn"); add("Elio",fmt(U.elio),"good"); }
  if(e==="ricomb"){ add("Idrogeno",fmt(U.idrogeno)); add("Elio",fmt(U.elio)); }
  if(["ricomb","stelle","galassie","pianeti","vita","mente","destino"].includes(e)){
    add("Gas disponibile",fmt(U.gas), U.gas<U.gasIniziale*0.15?"warn":null);
    add("Gas residuo",(U.gasIniziale>0?(U.gas/U.gasIniziale*100):0).toFixed(1)+"%",
        U.gas<U.gasIniziale*0.15?"warn":null);
  }
  if(["stelle","galassie","pianeti","vita","mente","destino"].includes(e)){
    add("Galassie",fmt(U.strutture.length));
    add("Stelle",fmt(U.stellePiccole+U.stelleMassicce));
    add("Stelle massicce",fmt(U.stelleMassicce));
    add("Metallicità",(metallicita()*100).toFixed(2)+"%","gold");
    add("Supernove",fmt(U.supernove));
    add("Buchi neri",fmt(U.buchiNeri));
  }
  if(["pianeti","vita","mente","destino"].includes(e)){
    add("Pianeti",fmt(U.pianeti)); add("Mondi abitabili",fmt(U.abitabili,1),"good");
  }
  if(["vita","mente","destino"].includes(e)){
    add("Biosfere",fmt(U.biosfere,1),"good"); add("Influenza",fmt(U.influenza),"gold");
  }
  if(["mente","destino"].includes(e)){ add("Civiltà",fmt(U.civilta,2),"good"); add("Comprensione",fmt(U.comprensioneRun,1),"gold"); }
  $("res-grid").innerHTML = r.map(x=>`<div class="res ${x.c||''}"><span>${x.n}</span><b>${x.v}</b></div>`).join("");
}

/* =========================================================
   RENDERING — CANVAS
========================================================= */
const cv=$("cv"), cx=cv.getContext("2d");
const W=cv.width, H=cv.height;
let particelle=[];
for(let i=0;i<520;i++){
  particelle.push({x:Math.random()*W,y:Math.random()*H,
    vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,r:Math.random()*1.6+.4});
}
let frame=0;

function coloreTemp(p){ // p: 0 (caldissimo) → 1 (freddo)
  if(p<.2) return `rgba(255,255,255,${.9-p})`;
  if(p<.45) return `rgba(180,220,255,.8)`;
  if(p<.7) return `rgba(255,190,120,.75)`;
  return `rgba(255,110,90,.6)`;
}

function disegna(){
  frame++;
  const e=ERE[U.era].id;
  const prog = U.eraDurata>0 ? U.eraT/U.eraDurata : 0;
  cx.fillStyle="#01030a"; cx.fillRect(0,0,W,H);

  if(e==="planck"){
    const pulse=1+Math.sin(frame*.06)*.12;
    const g=cx.createRadialGradient(W/2,H/2,0,W/2,H/2,120*pulse);
    g.addColorStop(0,"#ffffff"); g.addColorStop(.25,"#cfe6ff");
    g.addColorStop(.6,"rgba(140,120,255,.35)"); g.addColorStop(1,"rgba(0,0,0,0)");
    cx.fillStyle=g; cx.fillRect(0,0,W,H);
    cx.fillStyle="#fff";
    cx.beginPath(); cx.arc(W/2,H/2,5*pulse,0,6.29); cx.fill();
  }
  else if(e==="inflazione"){
    const r=Math.min(W,H)*(.1+prog*.9);
    for(let i=0;i<70;i++){
      const a=i/70*6.283+frame*.01;
      const d=r*(.4+Math.random()*.6);
      cx.strokeStyle=`rgba(180,200,255,${.25+Math.random()*.3})`;
      cx.beginPath(); cx.moveTo(W/2,H/2);
      cx.lineTo(W/2+Math.cos(a)*d,H/2+Math.sin(a)*d); cx.stroke();
    }
    const g=cx.createRadialGradient(W/2,H/2,0,W/2,H/2,r);
    g.addColorStop(0,"rgba(255,255,255,.6)"); g.addColorStop(1,"rgba(80,60,200,0)");
    cx.fillStyle=g; cx.fillRect(0,0,W,H);
  }
  else if(e==="quark"||e==="nucleo"){
    const caldo = e==="quark"?prog*.35:.35+prog*.3;
    particelle.forEach(p=>{
      p.x+=p.vx*(e==="quark"?2.2:1.1); p.y+=p.vy*(e==="quark"?2.2:1.1);
      if(p.x<0)p.x=W; if(p.x>W)p.x=0; if(p.y<0)p.y=H; if(p.y>H)p.y=0;
      cx.fillStyle=coloreTemp(caldo+Math.random()*.15);
      cx.beginPath(); cx.arc(p.x,p.y,p.r,0,6.29); cx.fill();
    });
    if(e==="nucleo"){
      // nuclei di elio formati
      const n=Math.min(160,Math.floor(U.elio/Math.max(1,U.gasIniziale||U.barioni)*400));
      for(let i=0;i<n;i++){
        const x=(i*97)%W, y=(i*53)%H;
        cx.fillStyle="rgba(120,255,200,.75)";
        cx.beginPath(); cx.arc(x,y,2.4,0,6.29); cx.fill();
      }
    }
    cx.fillStyle=`rgba(255,140,60,${.14*(1-prog)})`; cx.fillRect(0,0,W,H);
  }
  else if(e==="ricomb"){
    // radiazione cosmica di fondo
    const cw=W/COLS, ch=H/ROWS;
    for(let j=0;j<ROWS;j++)for(let i=0;i<COLS;i++){
      const d=densita[j][i];
      const sopra=d>U.sogliaCollasso;
      const v=Math.floor(60+d*150);
      cx.fillStyle = sopra? `rgb(${v+40},${Math.floor(v*.75)},${Math.floor(v*.55)})`
                          : `rgb(${Math.floor(v*.45)},${Math.floor(v*.5)},${v})`;
      cx.fillRect(i*cw,j*ch,cw+1,ch+1);
    }
    cx.fillStyle="rgba(0,0,0,"+(0.15+0.25*(1-prog))+")"; cx.fillRect(0,0,W,H);
  }
  else {
    // ere strutturate: ragnatela cosmica + galassie
    const cw=W/COLS, ch=H/ROWS;
    for(let j=0;j<ROWS;j++)for(let i=0;i<COLS;i++){
      const d=densita[j][i];
      if(d>U.sogliaCollasso*0.72){
        cx.fillStyle=`rgba(60,80,140,${(d-U.sogliaCollasso*0.72)*0.5})`;
        cx.fillRect(i*cw,j*ch,cw+1,ch+1);
      }
    }
    const tot=U.strutture.reduce((a,s)=>a+s.peso,0)||1;
    const stelleTot=U.stellePiccole+U.stelleMassicce;
    U.strutture.forEach(s=>{
      const x=s.i*cw+cw/2+(s.ox||0)*cw, y=s.j*ch+ch/2+(s.oy||0)*ch;
      const quota=s.peso/tot;
      const lum=clamp(stelleTot*quota/60,0,1);
      const raggio=(5+lum*20+s.peso*10)*(s.scala||1);
      if(lum>0.004){
        const g=cx.createRadialGradient(x,y,0,x,y,raggio);
        const z=metallicita();
        const col = z>0.03? "255,220,180" : z>0.008? "220,225,255" : "180,200,255";
        g.addColorStop(0,`rgba(${col},${clamp(lum*.9,0,.9)})`);
        g.addColorStop(.45,`rgba(${col},${clamp(lum*.28,0,.4)})`);
        g.addColorStop(1,"rgba(0,0,0,0)");
        cx.fillStyle=g;
        cx.beginPath(); cx.arc(x,y,raggio,0,6.29); cx.fill();
        // accenno di spirale
        if(lum>.25){
          cx.strokeStyle=`rgba(${col},${lum*.22})`; cx.lineWidth=1;
          for(let b=0;b<2;b++){
            cx.beginPath();
            for(let t=0;t<18;t++){
              const a=s.fase+b*3.14+t*.28+frame*.004;
              const rr=t/18*raggio*.85;
              const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr*.55;
              t?cx.lineTo(px,py):cx.moveTo(px,py);
            }
            cx.stroke();
          }
        }
      }
      // buchi neri supermassicci: solo i nuclei più massicci sono visibili
      if(U.massaBH*quota>U.gasIniziale*0.0016){
        cx.fillStyle="rgba(0,0,0,.9)";
        cx.beginPath(); cx.arc(x,y,1.5,0,6.29); cx.fill();
        cx.strokeStyle=`rgba(255,150,60,${clamp(U.massaBH*quota/Math.max(1,U.gasIniziale)*40,.12,.7)})`;
        cx.lineWidth=1;
        cx.beginPath(); cx.arc(x,y,3+Math.sin(frame*.05+s.fase)*.6,0,6.29); cx.stroke();
      }
      // vita
      if(U.biosfere*quota>0.05){
        cx.fillStyle=`rgba(110,231,168,${clamp(U.biosfere*quota*.5,.2,.9)})`;
        cx.beginPath(); cx.arc(x+4,y-4,1.8,0,6.29); cx.fill();
      }
      // civiltà
      if(U.civilta*quota>0.02){
        const pr=(frame*.02+s.fase)%1;
        cx.strokeStyle=`rgba(127,216,255,${(1-pr)*.5})`; cx.lineWidth=1;
        cx.beginPath(); cx.arc(x,y,raggio*.4+pr*26,0,6.29); cx.stroke();
      }
    });
    // entropia: il buio avanza
    if(U.entropia>0){ cx.fillStyle=`rgba(0,0,10,${U.entropia*.5})`; cx.fillRect(0,0,W,H); }
  }
  requestAnimationFrame(disegna);
}

// click sulla mappa durante la ricombinazione
cv.addEventListener("click",ev=>{
  if(ERE[U.era].id!=="ricomb"||U.perturbazioni<=0) return;
  const r=cv.getBoundingClientRect();
  const i=Math.floor((ev.clientX-r.left)/r.width*COLS);
  const j=Math.floor((ev.clientY-r.top)/r.height*ROWS);
  if(i<0||j<0||i>=COLS||j>=ROWS) return;
  U.perturbazioni--;
  for(let dj=-2;dj<=2;dj++)for(let di=-2;di<=2;di++){
    const y=j+dj,x=i+di;
    if(y<0||x<0||y>=ROWS||x>=COLS) continue;
    const dist=Math.hypot(di,dj);
    if(dist>2.4) continue;
    densita[y][x]=clamp(densita[y][x]+0.16*(1-dist/2.6),0,1);
  }
  aggiornaRicomb();
});

document.querySelectorAll(".speed button").forEach(b=>{
  b.addEventListener("click",()=>{
    velocita=+b.dataset.sp;
    document.querySelectorAll(".speed button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
  });
});

function loop(){
  const now=Date.now();
  let dt=(now-ultimo)/1000; ultimo=now;
  dt=Math.min(dt,0.4)*velocita;
  tick(dt);
  renderHUD();
}
setInterval(loop,100);

/* =========================================================
   AVVIO / RESET
========================================================= */
function iniziaUniverso(){
  U=nuovoUniverso();
  generaDensita(0.8);
  $("overlay").classList.add("hidden");
  $("era-nome").textContent=ERE[0].nome;
  $("era-sub").textContent=ERE[0].sub;
  $("canvas-hint").textContent=ERE[0].hint;
  $("ctrl-title").textContent=ERE[0].nome;
  $("log").innerHTML="";
  ERE[0].controlli();
  renderHUD();
  log(meta.universi===0
    ? "Non c'è spazio, non c'è tempo, non c'è materia. Solo la possibilità che qualcosa accada."
    : `Universo n°${meta.universi+1}. Porti con te ${meta.comprensione} punti di Comprensione dai cicli precedenti.`,"hl");
}
$("ov-btn").addEventListener("click",iniziaUniverso);
$("btn-reset").addEventListener("click",()=>{
  if(confirm("Abbandonare questo universo e ricominciare dal Big Bang?")) iniziaUniverso();
});
$("meta-info").textContent="";

iniziaUniverso();
disegna();

})();
</script>
